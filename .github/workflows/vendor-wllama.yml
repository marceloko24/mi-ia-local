name: Copiar el motor wllama al repo

on:
  push:
    branches: [main]
    paths:
      - "vendor/wllama/SHA256SUMS"
      - ".github/workflows/vendor-wllama.yml"
  workflow_dispatch:

jobs:
  vendor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Descargar paquetes de npm y verificar sumas
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          (cd "$tmp" && npm pack @wllama/wllama@3.13.0 @wllama/wllama-compat@3.13.0)
          mkdir -p "$tmp/main" "$tmp/compat" vendor/wllama/compat
          tar xzf "$tmp"/wllama-wllama-3.13.0.tgz -C "$tmp/main"
          tar xzf "$tmp"/wllama-wllama-compat-3.13.0.tgz -C "$tmp/compat"
          cp "$tmp/main/package/esm/index.min.js" vendor/wllama/wllama.min.js
          cp "$tmp/main/package/esm/wasm/wllama.wasm" vendor/wllama/wllama.wasm
          cp "$tmp/main/package/LICENCE" vendor/wllama/LICENCE
          cp "$tmp/compat/package/wasm/wllama.js" vendor/wllama/compat/wllama.js
          cp "$tmp/compat/package/wasm/wllama.wasm" vendor/wllama/compat/wllama.wasm
          sha256sum -c vendor/wllama/SHA256SUMS
      - name: Commitear los archivos del motor
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/wllama/wllama.min.js vendor/wllama/wllama.wasm vendor/wllama/LICENCE vendor/wllama/compat/wllama.js vendor/wllama/compat/wllama.wasm
          if git diff --cached --quiet; then
            echo "El motor ya estaba copiado."
            exit 0
          fi
          git commit -m "Copiar el motor wllama 3.13.0 (llama.cpp WebAssembly)"
          git push
